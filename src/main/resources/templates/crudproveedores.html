<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Mantenimiento de Proveedores</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Estilos de DataWeb: navbar y logo -->
	<link rel="stylesheet" th:href="@{/css/dataweb.css}">
</head>

<body class="bg-light">
	
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container mt-5 mb-5">

		<div class="card shadow-sm">

			<div class="card-header bg-primary text-white">
				<h1 class="h3 mb-0">Mantenimiento de Proveedores</h1>
			</div>

			<div class="card-body">

				<form th:action="@{/regisprov}" method="post" th:object="${proveedores}" class="row g-3">

					<!-- Campos ocultos -->
					<input type="hidden" th:field="*{idProveedor}">
					<input type="hidden" th:field="*{estado}">

					<!-- Razón social -->
					<div class="col-md-6">
						<label for="razonSocial" class="form-label">
							Razón social
						</label>

						<input type="text" id="razonSocial" class="form-control" th:field="*{razonSocial}"
							maxlength="150" placeholder="Ingrese la razón social" required>
					</div>

					<!-- RUC -->
					<div class="col-md-6">
						<label for="ruc" class="form-label">RUC</label>

						<input type="text" id="ruc" class="form-control" th:field="*{ruc}" maxlength="11" minlength="11"
							pattern="[0-9]{11}" title="El RUC debe contener 11 dígitos" placeholder="Ingrese el RUC"
							required>
					</div>

					<!-- Contacto -->
					<div class="col-md-6">
						<label for="contacto" class="form-label">
							Nombre del contacto
						</label>

						<input type="text" id="contacto" class="form-control" th:field="*{contacto}" maxlength="100"
							placeholder="Ingrese el contacto" required>
					</div>

					<!-- Teléfono -->
					<div class="col-md-6">
						<label for="telefono" class="form-label">
							Teléfono
						</label>

						<input type="tel" id="telefono" class="form-control" th:field="*{telefono}" maxlength="20"
							placeholder="Ingrese el teléfono">
					</div>

					<!-- Correo -->
					<div class="col-md-6">
						<label for="correo" class="form-label">
							Correo electrónico
						</label>

						<input type="email" id="correo" class="form-control" th:field="*{correo}" maxlength="120"
							placeholder="ejemplo@empresa.com">
					</div>

					<!-- Dirección -->
					<div class="col-md-6">
						<label for="direccion" class="form-label">
							Dirección
						</label>

						<input type="text" id="direccion" class="form-control" th:field="*{direccion}" maxlength="200"
							placeholder="Ingrese la dirección">
					</div>

					<!-- Rol -->
					<div class="col-md-6">
						<label for="idRol" class="form-label">
							Rol
						</label>

						<select id="idRol" class="form-select" th:field="*{idRol}" required>

							<option value="">Seleccione un rol</option>

							<option th:each="r : ${lstRoles}" th:value="${r.id_rol}" th:text="${r.nomRol}">
							</option>

						</select>
					</div>

					<!-- Categoría -->
					<div class="col-md-6">
						<label for="idCatProv" class="form-label">
							Categoría de proveedor
						</label>

						<select id="idCatProv" class="form-select" th:field="*{idCatProv}" required>

							<option value="">Seleccione una categoría</option>

							<option th:each="c : ${lstCategoriaProveedores}" th:value="${c.idCatProv}"
								th:text="${c.nombre}">
							</option>

						</select>
					</div>

					<!-- Botones -->
					<div class="col-12 mt-4">

						<button type="submit" class="btn btn-primary" th:text="${proveedores.idProveedor == null
                                ? 'Registrar proveedor'
                                : 'Actualizar proveedor'}">
							Registrar proveedor
						</button>

						<a th:href="@{/listaprov}" class="btn btn-secondary">
							Ver listado
						</a>

						<a th:href="@{/cargaProv}" class="btn btn-outline-dark">
							Limpiar
						</a>

						<a th:href="@{/}" class="btn btn-outline-primary">
							Inicio
						</a>

					</div>

				</form>

				<!-- Mensajes -->
				<div th:if="${mensaje != null}" class="mt-3" th:classappend="${cssmensaje}" role="alert"
					th:text="${mensaje}">
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
