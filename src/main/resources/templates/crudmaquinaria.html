<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Mantenimiento de Maquinaria</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container mt-5 mb-5">

		<div class="card shadow-sm">
			<div class="card-header bg-primary text-white">
				<h1 class="h3 mb-0">Mantenimiento de Maquinaria</h1>
			</div>

			<div class="card-body">
				<form th:action="@{/regismaqui}" method="post" th:object="${maquinaria}" class="row g-3">

					<!-- Campos ocultos: sin el id, al editar se crearia un registro nuevo -->
					<input type="hidden" th:field="*{id_maquinaria}">
					<input type="hidden" th:field="*{estado}">

					<!-- Nombre -->
					<div class="col-md-6">
						<label for="nomMaqui" class="form-label">
							Nombre de la maquinaria
						</label>
						<input type="text" id="nomMaqui" class="form-control" th:field="*{nomMaqui}"
							placeholder="Ingrese el nombre" maxlength="45" required>
					</div>

					<!-- Marca -->
					<div class="col-md-6">
						<label for="marca" class="form-label">
							Marca
						</label>
						<input type="text" id="marca" class="form-control" th:field="*{marca}"
							placeholder="Ingrese la marca" maxlength="45" required>
					</div>

					<!-- Potencia -->
					<div class="col-md-6">
						<label for="potenciaKw" class="form-label">
							Potencia (kW)
						</label>
						<input type="number" id="potenciaKw" class="form-control" th:field="*{potenciaKw}"
							placeholder="Ej. 15.5" min="0" step="0.01" required>
					</div>

					<!-- Precio -->
					<div class="col-md-6">
						<label for="precio" class="form-label">
							Precio
						</label>
						<input type="number" id="precio" class="form-control" th:field="*{precio}" placeholder="0.00"
							min="0" step="0.01" required>
					</div>

					<!-- Categoría -->
					<div class="col-md-6">
						<label for="idCatMaqui" class="form-label">
							Categoría de maquinaria
						</label>
						<select id="idCatMaqui" class="form-select" th:field="*{idCatMaqui}" required>
							<option value="">Seleccione una categoría</option>
							<option th:each="c : ${lstCategoriaMaquinaria}" th:value="${c.idCatMaqui}"
								th:text="${c.descripMaqui}">
							</option>
						</select>
					</div>

					<!-- Botones -->
					<div class="col-12 mt-4">
						<button type="submit" class="btn btn-primary"
							th:text="${maquinaria.id_maquinaria == null ? 'Registrar maquinaria' : 'Actualizar maquinaria'}">
							Registrar maquinaria
						</button>
						<a th:href="@{/listado}" class="btn btn-secondary">
							Ver listado
						</a>
						<a th:href="@{/cargaMaqui}" class="btn btn-outline-dark">
							Limpiar
						</a>
					</div>

				</form>

				<!-- Mensaje -->
				<div th:if="${mensaje != null}" class="mt-3" th:classappend="${cssmensaje}" role="alert"
					th:text="${mensaje}">
				</div>
			</div>
		</div>

	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>
</body>

</html>
