<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Listado de Clientes</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container mt-4 mb-5">

		<h1 class="mb-4">Listado de Clientes</h1>

		<div class="table-responsive">

			<table class="table table-hover table-striped table-bordered">

				<thead class="table-primary">
					<tr>
						<th scope="col">Código</th>
						<th scope="col">Nombres</th>
						<th scope="col">Apellidos</th>
						<th scope="col">DNI</th>
						<th scope="col">Teléfono</th>
						<th scope="col">Correo</th>
						<th scope="col">Dirección</th>
						<th scope="col">Categoría</th>
						<th scope="col">Estado</th>
						<th scope="col">Acciones</th>
					</tr>
				</thead>

				<tbody>

					<tr th:each="c : ${lstClientes}">

						<td th:text="${c.idCliente}">1</td>

						<td th:text="${c.nomCliente}">Carlos</td>

						<td th:text="${c.apeCliente}">
							Ramirez Torres
						</td>

						<td th:text="${c.dni}">70123456</td>

						<td th:text="${c.telefono}">987654321</td>

						<td th:text="${c.correo}">
							carlos.ramirez@gmail.com
						</td>

						<td th:text="${c.direccion}">
							Av. Arequipa 1250 - Lima
						</td>

						<td th:text="${c.objCatClient != null
                            ? c.objCatClient.descripClient
                            : 'Sin categoría'}">
							Persona natural
						</td>

						<td>
							<span th:if="${c.estado == 1}" class="badge bg-success">
								Activo
							</span>

							<span th:unless="${c.estado == 1}" class="badge bg-secondary">
								Inactivo
							</span>
						</td>

						<td>
							<a th:href="@{/editarCliente/{id}
                                (id=${c.idCliente})}" class="btn btn-warning btn-sm">
								Editar
							</a>
						</td>

					</tr>

					<tr th:if="${#lists.isEmpty(lstClientes)}">
						<td colspan="10" class="text-center">
							No hay clientes registrados.
						</td>
					</tr>

				</tbody>

			</table>
		</div>

		<a th:href="@{/cargaClientes}" class="btn btn-secondary">
			Volver al registro
		</a>

		<a th:href="@{/}" class="btn btn-outline-primary">
			Inicio
		</a>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
