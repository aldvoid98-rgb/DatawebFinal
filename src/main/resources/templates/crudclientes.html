<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Mantenimiento de Clientes</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container mt-5 mb-5">

		<div class="card shadow-sm">

			<div class="card-header bg-primary text-white">
				<h1 class="h3 mb-0">Mantenimiento de Clientes</h1>
			</div>

			<div class="card-body">

				<form th:action="@{/regisclientes}" method="post" th:object="${clientes}" class="row g-3">

					<!-- Campos ocultos -->
					<input type="hidden" th:field="*{idCliente}">
					<input type="hidden" th:field="*{estado}">

					<!-- Nombres -->
					<div class="col-md-6">
						<label for="nomCliente" class="form-label">
							Nombres
						</label>

						<input type="text" id="nomCliente" class="form-control" th:field="*{nomCliente}"
							placeholder="Ingrese los nombres" maxlength="100" required>
					</div>

					<!-- Apellidos -->
					<div class="col-md-6">
						<label for="apeCliente" class="form-label">
							Apellidos
						</label>

						<input type="text" id="apeCliente" class="form-control" th:field="*{apeCliente}"
							placeholder="Ingrese los apellidos" maxlength="100" required>
					</div>

					<!-- DNI -->
					<div class="col-md-6">
						<label for="dni" class="form-label">
							DNI
						</label>

						<input type="text" id="dni" class="form-control" th:field="*{dni}"
							placeholder="Ingrese los 8 dígitos" minlength="8" maxlength="8" pattern="[0-9]{8}"
							title="El DNI debe contener exactamente 8 dígitos" required>
					</div>

					<!-- Teléfono -->
					<div class="col-md-6">
						<label for="telefono" class="form-label">
							Teléfono
						</label>

						<input type="tel" id="telefono" class="form-control" th:field="*{telefono}"
							placeholder="Ingrese el teléfono" maxlength="20">
					</div>

					<!-- Correo -->
					<div class="col-md-6">
						<label for="correo" class="form-label">
							Correo electrónico
						</label>

						<input type="email" id="correo" class="form-control" th:field="*{correo}"
							placeholder="ejemplo@correo.com" maxlength="120">
					</div>

					<!-- Dirección -->
					<div class="col-md-6">
						<label for="direccion" class="form-label">
							Dirección
						</label>

						<input type="text" id="direccion" class="form-control" th:field="*{direccion}"
							placeholder="Ingrese la dirección" maxlength="200">
					</div>

					<!-- Categoría -->
					<div class="col-md-6">
						<label for="idCatClient" class="form-label">
							Categoría del cliente
						</label>

						<select id="idCatClient" class="form-select" th:field="*{idCatClient}" required>

							<option value="">
								Seleccione una categoría
							</option>

							<option th:each="c : ${lstCategoriaClientes}" th:value="${c.idCatClient}"
								th:text="${c.descripClient}">
							</option>

						</select>
					</div>

					<!-- Botones -->
					<div class="col-12 mt-4">

						<button type="submit" class="btn btn-primary" th:text="${clientes.idCliente == null
                                    ? 'Registrar cliente'
                                    : 'Actualizar cliente'}">
							Registrar cliente
						</button>

						<a th:href="@{/listadoclientes}" class="btn btn-secondary">
							Ver listado
						</a>

						<a th:href="@{/cargaClientes}" class="btn btn-outline-dark">
							Limpiar
						</a>

					</div>

				</form>

				<!-- Mensajes de éxito o error -->
				<div th:if="${mensaje != null}" class="mt-3" th:classappend="${cssmensaje}" role="alert"
					th:text="${mensaje}">
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
