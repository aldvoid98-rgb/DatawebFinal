<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Iniciar sesión | Cibertec</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- CSS personalizado -->
	<link rel="stylesheet" href="/css/login.css">
</head>

<body class="login-body">

	<main class="login-container">
		<section class="login-brand">
			<div class="brand-icon">
				<img th:src="@{/img/LogoDataweb.jpg}" alt="Logo de DataWeb" class="brand-logo">
			</div>

			<h1>DataWeb</h1>
			<p class="brand-subtitle">SISTEMA DE GESTIÓN</p>

			<div class="brand-decoration"></div>

			<p class="brand-description">
				Administra tus recursos de manera eficiente,
				segura y sencilla.
			</p>
		</section>

		<section class="login-panel">
			<div class="login-heading">
				<span class="welcome-label">BIENVENIDO</span>
				<h2>Iniciar sesión</h2>
				<p>Ingresa tus datos para acceder al sistema.</p>
			</div>

			<form action="/login" method="post">

				<div class="mb-4">
					<label for="correo" class="form-label">
						Correo electrónico
					</label>

					<input type="email" class="form-control custom-input" id="correo" name="username"
						placeholder="usuario@empresa.com" autocomplete="username" required>
				</div>

				<div class="mb-3">
					<label for="clave" class="form-label">
						Contraseña
					</label>

					<input type="password" class="form-control custom-input" id="clave" name="password"
						placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
				</div>

				<div class="d-flex justify-content-between
                            align-items-center mb-4">
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="recordar">

						<label class="form-check-label" for="recordar">
							Recordarme
						</label>
					</div>
				</div>

				<button type="submit" class="btn login-button w-100">
					Iniciar sesión
					<span class="button-arrow">→</span>
				</button>

				<div th:if="${error}" class="alert alert-danger mt-3" role="alert" th:text="${error}">
				</div>

				<p class="login-footer">
					Acceso exclusivo para usuarios autorizados.
				</p>
			</form>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>
</body>

</html>
