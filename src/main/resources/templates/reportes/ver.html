<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Reporte de ' + ${titulo} + ' | DataWeb'">Reporte | DataWeb</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/dataweb.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container-fluid px-lg-4 py-4">

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h3 mb-0" th:text="'Reporte de ' + ${titulo}">Reporte</h1>

    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-primary" th:href="@{/reportes/{tipo}/descargar(tipo=${tipo},formato='pdf')}">Descargar PDF</a>
      <a class="btn btn-outline-success" th:href="@{/reportes/{tipo}/descargar(tipo=${tipo},formato='xlsx')}">Descargar Excel</a>

      <!-- Administrador y jefe vuelven a la lista de reportes; el proveedor, al inicio -->
      <a class="btn btn-outline-secondary" th:if="${session.rol != 'PROVEEDOR'}" th:href="@{/reportes}">Volver a reportes</a>
      <a class="btn btn-outline-secondary" th:if="${session.rol == 'PROVEEDOR'}" th:href="@{/inicio}">Inicio</a>
    </div>
  </div>

  <div class="card shadow-sm">
    <iframe th:src="@{/reportes/{tipo}/ver(tipo=${tipo})}" title="Vista previa del reporte"
            style="width:100%; height:78vh; border:0;"></iframe>
  </div>

  <p class="text-secondary small mt-2">
    Si tu navegador no muestra el PDF, usa el botón <strong>Descargar PDF</strong>.
  </p>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
