<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Mantenimiento de Empleados</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container mt-5 mb-5">

		<div class="card shadow-sm">

			<div class="card-header bg-primary text-white">
				<h1 class="h3 mb-0">Mantenimiento de Empleados</h1>
			</div>

			<div class="card-body">

				<form th:action="@{/regisempleado}" method="post" th:object="${empleados}" class="row g-3">

					<!-- Campos ocultos para conservar los datos al editar -->
					<input type="hidden" th:field="*{id_empleado}">
					<input type="hidden" th:field="*{estado}">

					<!-- Nombres -->
					<div class="col-md-6">
						<label for="nomEmpl" class="form-label">
							Nombres
						</label>

						<input type="text" id="nomEmpl" class="form-control" th:field="*{nomEmpl}"
							placeholder="Ingrese los nombres" maxlength="100" required>
					</div>

					<!-- Apellidos -->
					<div class="col-md-6">
						<label for="apeEmpl" class="form-label">
							Apellidos
						</label>

						<input type="text" id="apeEmpl" class="form-control" th:field="*{apeEmpl}"
							placeholder="Ingrese los apellidos" maxlength="100" required>
					</div>

					<!-- DNI -->
					<div class="col-md-6">
						<label for="dniEmpl" class="form-label">
							DNI
						</label>

						<input type="text" id="dniEmpl" class="form-control" th:field="*{dniEmpl}"
							placeholder="Ingrese 8 dígitos" pattern="[0-9]{8}" minlength="8" maxlength="8" required>
					</div>

					<!-- Cargo -->
					<div class="col-md-6">
						<label for="cargo" class="form-label">
							Cargo
						</label>

						<input type="text" id="cargo" class="form-control" th:field="*{cargo}"
							placeholder="Ej. Operador de maquinaria" maxlength="100">
					</div>

					<!-- Teléfono -->
					<div class="col-md-6">
						<label for="telEmpl" class="form-label">
							Teléfono
						</label>

						<input type="tel" id="telEmpl" class="form-control" th:field="*{telEmpl}"
							placeholder="Ingrese el teléfono" maxlength="20">
					</div>

					<!-- Correo -->
					<div class="col-md-6">
						<label for="correEmpl" class="form-label">
							Correo electrónico
						</label>

						<input type="email" id="correEmpl" class="form-control" th:field="*{correEmpl}"
							placeholder="ejemplo@correo.com" maxlength="120">
					</div>

					<!-- Fecha de ingreso -->
					<div class="col-md-6">
						<label for="fecha_ingreso" class="form-label">
							Fecha de ingreso
						</label>

						<input type="date" id="fecha_ingreso" class="form-control" th:field="*{fecha_ingreso}">
					</div>

					<!-- Rol -->
					<div class="col-md-6">
						<label for="id_rol" class="form-label">
							Rol del sistema
						</label>

						<select id="id_rol" class="form-select" th:field="*{id_rol}" required>

							<option value="">Seleccione un rol</option>

							<option th:each="r : ${lstRoles}" th:value="${r.id_rol}" th:text="${r.nomRol}">
							</option>
						</select>
					</div>

					<!-- Categoría -->
					<div class="col-md-6">
						<label for="idCatEmple" class="form-label">
							Categoría del empleado
						</label>

						<select id="idCatEmple" class="form-select" th:field="*{idCatEmple}" required>

							<option value="">Seleccione una categoría</option>

							<option th:each="c : ${lstCategoriaEmpleados}" th:value="${c.idCatEmple}"
								th:text="${c.descripEmple}">
							</option>
						</select>
					</div>

					<!-- Botones -->
					<div class="col-12 mt-4">

						<button type="submit" class="btn btn-primary" th:text="${empleados.id_empleado == null
                                ? 'Registrar empleado'
                                : 'Actualizar empleado'}">
							Registrar empleado
						</button>

						<a th:href="@{/listadoEmpleados}" class="btn btn-secondary">
							Ver listado
						</a>

						<a th:href="@{/cargaEmpleados}" class="btn btn-outline-dark">
							Limpiar
						</a>

						<a th:href="@{/}" class="btn btn-outline-primary">
							Inicio
						</a>

					</div>

				</form>

				<!-- Mensaje de resultado -->
				<div th:if="${mensaje != null}" class="mt-3" th:classappend="${cssmensaje}" role="alert"
					th:text="${mensaje}">
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
