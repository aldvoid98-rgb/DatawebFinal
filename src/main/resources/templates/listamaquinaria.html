<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Listado de Maquinarias</title>
	<!-- importamos estilos bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
	<div class="container mt-4">
		<h1>Listado de Maquinarias</h1>

		<!-- tabla -->
		<table class="table table-hover table-striped">
			<thead>
				<tr>
					<th scope="col">Código</th>
					<th scope="col">Nombre</th>
					<th scope="col">Marca</th>
					<th scope="col">Potencia (kW)</th>
					<th scope="col">Precio</th>
					<th scope="col">Categoría</th>
					<th scope="col"></th>
				</tr>
			</thead>
			<tbody>
				<!-- recorrer el atributo lstMaquinaria para generar las filas -->
				<tr th:each="m : ${lstMaquinaria}">
					<td th:text="${m.id_maquinaria}">1</td>
					<td th:text="${m.nomMaqui}">Prensa offset</td>
					<td th:text="${m.marca}">Heidelberg</td>
					<td th:text="${m.potenciaKw}">15.0</td>
					<td th:text="${'S/ ' + #numbers.formatDecimal(m.precio, 1, 'COMMA', 2, 'POINT')}">S/ 25,50</td>
					<td th:text="${m.objCatMaqui?.descripMaqui}">Categoría</td>
					<td>
						<a th:href="@{/editar/{id}(id=${m.id_maquinaria})}" class="btn btn-warning">Editar</a>
					</td>
					
					<th scope="row">
						<img th:src="@{/img/maquinaria/}+${m.id_maquinaria <= 10 ? m.id_maquinaria : 'noimagen'}+@{.png}"
						width="80" height="80" alt="imagen">
					</th>
				</tr>
			</tbody>
		</table>

		<a th:href="@{/cargaMaqui}" class="btn btn-secondary">Volver al registro</a>
	</div>

	<!-- importamos lib js de bootstrap -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
